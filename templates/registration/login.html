{% extends 'base.html' %}
{% load static %}
{% block title %}Connexion | AgroSedam{% endblock %}
{% block content %}
<div class="container py-5 page-transition">
    <div class="row justify-content-center">
        <div class="col-lg-5">
            <div class="section-header fade-in-up text-center">
                <h2 class="mb-0"><i class="fas fa-sign-in-alt me-2"></i>Connexion</h2>
                <p class="mb-0">Accédez à votre tableau de bord</p>
            </div>
            <div class="form-card fade-in-up delay-1">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button class="btn btn-success w-100 mt-3" type="submit"><i class="fas fa-sign-in-alt me-2"></i>Se connecter</button>
                </form>
                <div class="mt-3 text-center">
                    <a href="{% url 'password_reset' %}" class="text-muted">Mot de passe oublié ?</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
