{% extends 'base.html' %}
{% load static %}
{% block title %}{{ title }} | AgroSedam{% endblock %}
{% block content %}
<div class="container py-5 page-transition">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="section-header fade-in-up orange">
                <h2 class="mb-0"><i class="fas fa-cow me-2"></i>{{ title }}</h2>
            </div>
            <div class="form-card fade-in-up delay-1">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="btn-group mt-4">
                        <button class="btn btn-success" type="submit"><i class="fas fa-save me-2"></i>Enregistrer</button>
                        <a class="btn btn-outline-success" href="{% url 'animals' %}"><i class="fas fa-arrow-left me-2"></i>Retour</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
